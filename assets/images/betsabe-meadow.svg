      .gerbera-pink { --petal-color: #e98972; }
      .sway { transform-box: fill-box; transform-origin: center bottom; animation: breeze 7s ease-in-out infinite; }
      .sway-slow { animation-duration: 9s; animation-delay: -3s; }
      .sway-fast { animation-duration: 6s; animation-delay: -1.5s; }
      @keyframes breeze { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
