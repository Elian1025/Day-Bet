<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="birthday-sky" x2="0" y2="1">
      <stop stop-color="#385a70"/><stop offset=".45" stop-color="#6c8d99"/>
      <stop offset=".76" stop-color="#e7a174"/><stop offset="1" stop-color="#ec855e"/>
    </linearGradient>
    <radialGradient id="birthday-sun">
      <stop stop-color="#ffe9af" stop-opacity=".9"/><stop offset=".5" stop-color="#ffd18d" stop-opacity=".3"/>
      <stop offset="1" stop-color="#ffd18d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cake-cream" x2="0" y2="1"><stop stop-color="#fff5dc"/><stop offset="1" stop-color="#e9d5b5"/></linearGradient>
    <linearGradient id="cake-blue" x2="0" y2="1"><stop stop-color="#9dd5df"/><stop offset="1" stop-color="#68acbf"/></linearGradient>
    <linearGradient id="dentist-coat" x2="0" y2="1"><stop stop-color="#fffef7"/><stop offset="1" stop-color="#e9f1ed"/></linearGradient>
    <radialGradient id="warm-window"><stop stop-color="#ffe9b5" stop-opacity=".7"/><stop offset="1" stop-color="#ffe9b5" stop-opacity="0"/></radialGradient>
    <g id="birthday-candle-shape">
      <rect class="wax" x="-5" y="-72" width="10" height="72" rx="5"/>
      <path class="candle-flame" d="M0-77c-17-17 1-30 4-43 17 19 16 34 2 44 0 0-3 1-6-1Z"/>
      <path d="M1-81c-6-8 1-16 4-22 5 10 3 18-4 22Z" fill="#fff2bb" opacity=".86"/>
    </g>
    <g id="gerbera-head">
      <g fill="#e78c69">
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(45)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(90)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(135)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(180)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(225)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(270)"/>
        <path d="M0-4c-16-16-13-40 0-50 13 10 16 34 0 50Z" transform="rotate(315)"/>
      </g><circle r="10" fill="#80543c"/>
    </g>
    <style>
      .birthday-candle rect { fill: #f4d06e; }
      .birthday-candle:nth-child(3n + 2) rect { fill: #83c5d4; }
      .birthday-candle:nth-child(3n) rect { fill: #e98a62; }
      .candle-flame { fill: #ffc75d; transform-box: fill-box; transform-origin: 50% 100%; animation: candle-glow 1.7s ease-in-out infinite alternate; }
      .meadow-flower { transform-box: fill-box; transform-origin: center bottom; animation: flower-sway 6s ease-in-out infinite; }
      .meadow-flower:nth-child(even) { animation-delay: -2.4s; animation-duration: 7.5s; }
      .twinkle { animation: star-glow 3.4s ease-in-out infinite alternate; }
      .twinkle:nth-child(even) { animation-delay: -1.7s; }
      @keyframes candle-glow { from { transform: scale(.92) rotate(-2deg); opacity: .86; } to { transform: scale(1.05) rotate(2deg); opacity: 1; } }
      @keyframes flower-sway { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
      @keyframes star-glow { from { opacity: .32; } to { opacity: .92; } }
      @media (prefers-reduced-motion: reduce) { .candle-flame, .meadow-flower, .twinkle { animation: none; } }
    </style>
  </defs>

